[package]
name = "todotxt"
version = "26.3.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.31"
thiserror = "2"

[dependencies.uuid]
version = "1.5.0"
features = ["v4", "fast-rng", "macro-diagnostics"]

[target.'cfg(unix)'.dependencies]
# The user ID names the lock directory, which must not depend on the environment.
libc = "0.2"
