[package]
name = "rtmapp"
version = "0.1.4"
edition = "2024"
description = "Desktop app (egui) for rtm"
license = "MIT"
repository = "https://github.com/brcha/rtm"

[dependencies]
todotxt = { path = "../todotxt" }
eframe = "0.37"
chrono = "0.4.31"
serde = { version = "1", features = ["derive"] }
dirs = "5"
toml = "0.8"
rfd = "0.16"
env_logger = { version = "0.11.11", default-features = false }
# The calendar's first day of the week: the OS locale, and CLDR's week data for it.
sys-locale = "0.3"
icu_calendar = "2.4"
icu_locale_core = "2.4"

# The taskbar ID (AppUserModelID); 0.52 is the version winit already pulls in.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_UI_Shell"] }

# CoTaskMemFree, for the test that reads the ID back.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Com"] }

[build-dependencies]
# Embeds the exe icon on Windows targets (see build.rs).
winresource = "0.1.34"

# Debian package, built with cargo-deb by the Release workflow. Depends lists only what the app needs on
# Wayland (it loads these with dlopen, so $auto cannot see them): the Wayland client and xkbcommon, a GPU
# API (OpenGL ES through EGL, or Vulkan), fontconfig (system fonts for glyphs missing from the bundled
# Inter), and the XDG portal with a backend that has a file chooser (not the virtual
# xdg-desktop-portal-backend: xdg-desktop-portal-wlr provides it without one). X11 support is optional.
[package.metadata.deb]
name = "rtmapp"
maintainer = "Filip Brcic <filip.brcic@brcha.com>"
section = "utils"
priority = "optional"
depends = "$auto, libwayland-client0, libxkbcommon0, libegl1 | libvulkan1, libwayland-egl1, libfontconfig1, xdg-desktop-portal, xdg-desktop-portal-gtk | xdg-desktop-portal-gnome | xdg-desktop-portal-kde"
suggests = "libx11-6, libx11-xcb1, libxcursor1, libxi6, libxkbcommon-x11-0"
assets = [
    ["target/release/rtmapp", "usr/bin/", "755"],
    ["assets/rtmapp.desktop", "usr/share/applications/", "644"],
    ["assets/icons/16x16.png", "usr/share/icons/hicolor/16x16/apps/rtmapp.png", "644"],
    ["assets/icons/24x24.png", "usr/share/icons/hicolor/24x24/apps/rtmapp.png", "644"],
    ["assets/icons/32x32.png", "usr/share/icons/hicolor/32x32/apps/rtmapp.png", "644"],
    ["assets/icons/128x128.png", "usr/share/icons/hicolor/128x128/apps/rtmapp.png", "644"],
    ["assets/icons/128x128@2x.png", "usr/share/icons/hicolor/256x256/apps/rtmapp.png", "644"],
    ["assets/icons/icon.png", "usr/share/icons/hicolor/512x512/apps/rtmapp.png", "644"],
    ["assets/icons/rtmapp.svg", "usr/share/icons/hicolor/scalable/apps/rtmapp.svg", "644"],
    ["../LICENSE", "usr/share/doc/rtmapp/copyright", "644"],
    ["assets/fonts/Inter-LICENSE.txt", "usr/share/doc/rtmapp/", "644"],
]
