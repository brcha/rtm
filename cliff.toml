# git-cliff configuration for CHANGELOG.md, which lives on the release branches (releases/vYY.M)
# only. Run through scripts/changelog.sh, which picks the commit range; see the root AGENTS.md
# (Release Process).

[changelog]
header = """
# Changelog

Generated with git-cliff from the squash-merged pull requests of this release line.\n
"""
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# The release PRs' own commits are not changes.
commit_parsers = [
  { message = "^build: set version to ", skip = true },
  { message = "^docs: changelog for ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^build", group = "<!-- 5 -->Build" },
  { message = "^ci", group = "<!-- 6 -->CI" },
  { message = "^test", group = "<!-- 7 -->Tests" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
