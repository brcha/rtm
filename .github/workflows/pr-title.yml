name: PR Title

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, edited, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: ytanikin/pr-conventional-commits@639145d78959c53c43112365837e3abd21ed67c1 # 1.5.2
        with:
          task_types: '["feat","fix","docs","test","ci","build","refactor","perf","style","chore","revert"]'
          title_regex: ' -- RTM-\d+$'
          add_label: 'true'
