name: Release

on:
  push:
    tags:
      - 'v*'
  # On a release branch (releases/vYY.M) a manual run is a release: it publishes a draft tagged
  # with the committed version. On any other branch it is a dry run.
  workflow_dispatch:
    inputs:
      previous:
        description: 'Release tag to test the upgrade from (vX.Y.Z), instead of the newest earlier release'
        required: false
        default: ''
  # Builds and tests the packages (publishes nothing) when a pull request touches anything that
  # goes into them (see the changes job), so packaging breaks are caught before a tag rather than
  # at release time. Every pull request runs the workflow, so the required gate check always
  # reports.
  pull_request:
    branches: [ "main", "releases/**" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether the pull request changes anything that goes into the packages, Markdown excluded. Runs
  # on every event and never under an `if:`: version needs it, and on other events it always
  # reports code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - id: diff
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the pull request's merge commit, HEAD^1 the base it merges into. --no-renames
          # lists both paths of a rename, so renaming a source file to .md still counts as code.
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          inputs='^(rtmapp|rtmcli|rtmsync|todotxt)/|^(Cargo\.toml|Cargo\.lock|LICENSE|scripts/build-appimage\.sh|scripts/build-macos\.sh|\.github/workflows/release\.yml)$'
          # No -q at the end: grep -q exits early, and pipefail would read the first grep's
          # SIGPIPE as "no code".
          if grep -E "$inputs" <<< "$files" | grep -v '\.md$' > /dev/null; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  # Extracted into its own job so all platform jobs depend on the same version checks via
  # `needs:` instead of duplicating them. Runs on ubuntu-latest purely as a cheap host for pwsh;
  # it builds nothing. Skipped when the changes job finds nothing to build, and the platform jobs
  # skip with it.
  version:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      # release (tag push, or a manual run on releases/**), dry-run (any other manual run) or check
      # (pull request); publish acts on it.
      mode: ${{ steps.version.outputs.mode }}
      latest: ${{ steps.release.outputs.latest }}
      # The version's section of CHANGELOG.md, the draft release's body (release mode only).
      notes: ${{ steps.release.outputs.notes }}
      previous: ${{ steps.previous.outputs.previous }}

    steps:
      - uses: actions/checkout@v7

      # The committed manifest is the single source of truth for the release version -- this
      # workflow never writes to it. The [package] version of rtmapp/Cargo.toml drives the MSI
      # ProductVersion, the exe metadata and both debs (scripts/set-version.* keeps the three
      # crates in lockstep). Only the [package] table is searched: other tables can have their
      # own `version` keys. On a tag push the tag must match exactly, so a forgotten version bump
      # fails the build loudly instead of shipping packages whose version disagrees with their
      # own file names. On a release branch the branch must match it: releases/v26.1 releases
      # only 26.1.*.
      - name: Determine and verify release version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $manifest = 'rtmapp/Cargo.toml'
          $content = Get-Content -Raw -Path $manifest
          $block = [regex]::Match($content, '(?ms)^\[package\](?<body>.*?)(?=^\[|\z)')
          if (-not $block.Success) {
            throw "Could not find a [package] table in $manifest."
          }
          $match = [regex]::Match($block.Groups['body'].Value, '(?m)^version = "([^"]*)"')
          if (-not $match.Success) {
            throw "Could not find a version key in the [package] table of $manifest."
          }
          $version = $match.Groups[1].Value
          Write-Host "Committed version (from ${manifest}): $version"

          if ($env:EVENT_NAME -eq 'push') {
            $mode = 'release'
            $tagVersion = $env:TAG_NAME -replace '^[vV]', ''
            if ($tagVersion -ne $version) {
              throw "Tag '$env:TAG_NAME' (version '$tagVersion') does not match the version " +
                    "committed in $manifest ('$version'). Bump the version with " +
                    "scripts/set-version.ps1 or scripts/set-version.sh, commit it, and only then tag the release."
            }
            Write-Host "Tag matches committed version."
          } elseif ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:REF.StartsWith('refs/heads/releases/')) {
            $mode = 'release'
            $branch = $env:REF -replace '^refs/heads/', ''
            if ($branch -notmatch '^releases/v(\d+\.\d+)$') {
              throw "Release branch '$branch' is not named releases/vYY.M."
            }
            if (-not $version.StartsWith("$($Matches[1]).")) {
              throw "Release branch '$branch' releases only $($Matches[1]).*, but $manifest has '$version'. " +
                    "Bump the version with scripts/set-version.ps1 or scripts/set-version.sh in a PR against the branch."
            }
            Write-Host "Release branch '$branch' matches committed version."
          } else {
            $mode = if ($env:EVENT_NAME -eq 'workflow_dispatch') { 'dry-run' } else { 'check' }
            Write-Host "$env:EVENT_NAME run: building committed version as-is, no tag to verify against."
          }
          Write-Host "Mode: $mode"

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "mode=$mode"

      # A release from a release branch must not exist yet, as a tag or as a release (drafts
      # included: a draft has no tag until it is published). Draft releases are only visible with
      # write access, which the workflow-level `contents: write` gives; narrowing it breaks this
      # check. Also decides whether the release becomes Latest: a patch on an older line (26.1.2
      # after 26.2.0) must not. Every release, a hand-pushed tag included, needs the version's
      # section in CHANGELOG.md (written by scripts/changelog.sh in the release PR); it becomes the
      # draft's body.
      # shortcut: two manual runs of one version at once can both pass and make two drafts; delete
      # one by hand, or add a concurrency group if that ever happens.
      - name: Check the release
        id: release
        if: steps.version.outputs.mode == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "gh release list failed ($LASTEXITCODE)." }

          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $existing = $releases | Where-Object { $_.tagName -eq $tag }
            if ($existing) {
              throw "A $(if ($existing[0].isDraft) { 'draft ' })release for $tag already exists."
            }
            $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "git ls-remote failed ($LASTEXITCODE)." }
            if ($remoteTag) { throw "Tag $tag already exists." }
            Write-Host "No release or tag for $tag yet."
          }

          $newer = $releases |
            Where-Object { -not $_.isDraft -and $_.tagName -match '^v(\d+\.\d+\.\d+)$' -and [version]$Matches[1] -gt [version]$env:VERSION }
          $latest = if ($newer) { 'false' } else { 'true' }
          Write-Host "Latest: $latest"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "latest=$latest"

          if (-not (Test-Path CHANGELOG.md)) {
            throw "CHANGELOG.md not found. Write it with scripts/changelog.sh $env:VERSION in the release PR."
          }
          $notes = @()
          $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line.StartsWith('## ')) {
              if ($inSection) { break }
              $inSection = $line.StartsWith("## [$env:VERSION]")
            } elseif ($inSection) {
              $notes += $line
            }
          }
          if (-not ($notes | Where-Object { $_.StartsWith('- ') })) {
            throw "CHANGELOG.md has no entries for $env:VERSION. Write them with scripts/changelog.sh $env:VERSION in the release PR."
          }
          # A random delimiter, so no changelog line can end the value early.
          $delimiter = "NOTES_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notes<<$delimiter"
          Add-Content -Path $env:GITHUB_OUTPUT -Value (($notes -join "`n").Trim())
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delimiter

      # The release the upgrade tests start from: the newest published (non-draft) release below the
      # version being built. Prereleases count -- every release so far is one. Empty if there is
      # none. A manual run can name one with the `previous` input instead.
      - name: Find the previous release
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_INPUT: ${{ inputs.previous }}
        run: |
          $pattern = '^v(\d+\.\d+\.\d+)$'
          if ($env:PREVIOUS_INPUT) {
            if ($env:PREVIOUS_INPUT -notmatch $pattern) { throw "Input 'previous' must look like v1.2.3, got '$env:PREVIOUS_INPUT'." }
            $previous = $env:PREVIOUS_INPUT
            Write-Host "Previous release (from the input): $previous"
          } else {
            $releases = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --limit 100 --json tagName | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "gh release list failed ($LASTEXITCODE)." }
            $previous = $releases.tagName |
              Where-Object { $_ -match $pattern -and [version]$Matches[1] -lt [version]$env:VERSION } |
              Sort-Object { [version]($_ -replace '^v', '') } |
              Select-Object -Last 1
            Write-Host "Previous release: $(if ($previous) { $previous } else { 'none' })"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "previous=$previous"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # rtmapp's build.rs embeds the icon and version information in rtmapp.exe (winresource).
      - name: Build rtmapp and rtmcli
        run: cargo build --release -p rtmapp -p rtmcli

      # Compiled with --locked for the same reasons as cargo-deb on the Linux job (RTM-29);
      # version pinned so a new release cannot change the MSI mid-run. cargo-wix 0.3.9 drives the
      # WiX v3 toolset by default.
      - name: Install cargo-wix
        run: cargo install cargo-wix --locked --version 0.3.9

      # cargo-wix finds WiX through the WIX environment variable that the WiX v3 installer sets.
      # The Windows 2025 and 2022 runner images list WiX Toolset 3.14.1 (checked October 2026);
      # install it if a future image drops it.
      - name: Ensure the WiX v3 toolset
        shell: pwsh
        run: |
          if ($env:WIX -and (Test-Path (Join-Path $env:WIX 'bin\candle.exe'))) {
            Write-Host "WiX found at $env:WIX"
          } else {
            choco install wixtoolset --version 3.14.1 --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install wixtoolset failed ($LASTEXITCODE)." }
            $wix = [Environment]::GetEnvironmentVariable('WIX', 'Machine')
            if (-not $wix) { throw 'WiX installed, but the WIX environment variable is not set.' }
            Add-Content -Path $env:GITHUB_ENV -Value "WIX=$wix"
            Write-Host "WiX installed at $wix"
          }

      # Unsigned for now (RTM-10). Signing would sign rtmapp.exe before this step and the MSI
      # after it, with the certificate and password from repository secrets.
      - name: Build rtmapp MSI
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          cargo wix -p rtmapp --no-build --nocapture --output "dist/rtmapp_${env:VERSION}_x64_en-US.msi"
          if ($LASTEXITCODE -ne 0) { throw "cargo wix failed ($LASTEXITCODE)." }

      # Stages rtmcli.exe and asserts both release assets exist before upload. rtmapp.exe is
      # deliberately not staged -- the MSI installs the same binary, so shipping it loose is
      # redundant. rtmcli.exe stays: the MSI only packages rtmapp, so the raw binary is the sole
      # channel for the CLI on Windows.
      - name: Stage release artifacts
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          Copy-Item 'target/release/rtmcli.exe' "dist/rtmcli-${env:VERSION}-x64.exe" -ErrorAction Stop

          $expected = @(
            "dist/rtmapp_${env:VERSION}_x64_en-US.msi",
            "dist/rtmcli-${env:VERSION}-x64.exe"
          )
          foreach ($f in $expected) {
            if (-not (Test-Path -LiteralPath $f)) {
              throw "Expected release artifact missing after staging: $f"
            }
          }

          Write-Host 'Staged artifacts:'
          Get-ChildItem dist | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

      # The last Tauri MSI, for the upgrade check below.
      - name: Download the v0.1.3 Tauri MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.3 --repo $env:GITHUB_REPOSITORY --pattern 'rtmapp_0.1.3_x64_en-US.msi' --dir old-msi
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed ($LASTEXITCODE)." }

      # Building an MSI is not evidence it installs. A fresh, silent install of the new MSI (both
      # shortcut features are on by default), its files, the shortcuts' AppUserModelID and the exe's
      # embedded version information, then an uninstall.
      - name: Verify MSI install
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $installDir = Join-Path $env:ProgramFiles 'Rusty Todo.txt Manager'
          $exe = Join-Path $installDir 'rtmapp.exe'
          $startMenu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Rusty Todo.txt Manager.lnk'
          $desktop = Join-Path $env:PUBLIC 'Desktop\Rusty Todo.txt Manager.lnk'

          function Invoke-Msiexec([string[]] $arguments, [string] $log) {
            $p = Start-Process msiexec.exe -ArgumentList ($arguments + @('/qn', '/norestart', '/l*v', $log)) -Wait -PassThru
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              Get-Content $log -Tail 60
              throw "msiexec $($arguments -join ' ') failed with exit code $($p.ExitCode)."
            }
          }
          # Installed products of that name, from the uninstall entries Windows Installer writes.
          function Get-Installed {
            @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq 'Rusty Todo.txt Manager' } |
              ForEach-Object { [pscustomobject]@{ Code = [string]$_.PSChildName; Version = [string]$_.DisplayVersion } })
          }

          Invoke-Msiexec @('/i', (Resolve-Path "dist/rtmapp_${env:VERSION}_x64_en-US.msi").Path) 'install-fresh.log'
          $products = Get-Installed
          if ($products.Count -ne 1) { throw "Expected one product after installing, found $($products.Count)." }
          if ($products[0].Version -ne $env:VERSION) { throw "Installed version is '$($products[0].Version)', expected '$env:VERSION'." }

          foreach ($f in @($exe, (Join-Path $installDir 'LICENSE.txt'), (Join-Path $installDir 'Inter-LICENSE.txt'), $startMenu, $desktop)) {
            if (-not (Test-Path -LiteralPath $f)) { throw "Missing after install: $f" }
          }
          # The taskbar ID (RTM-48), through the shell's property system.
          $shell = New-Object -ComObject Shell.Application
          foreach ($lnk in @($startMenu, $desktop)) {
            $id = $shell.NameSpace((Split-Path $lnk)).ParseName((Split-Path $lnk -Leaf)).ExtendedProperty('System.AppUserModel.ID')
            Write-Host "${lnk}: AppUserModelID '$id'"
            if ($id -ne 'com.brcha.rtm') { throw "Shortcut has AppUserModelID '$id', expected 'com.brcha.rtm': $lnk" }
          }
          $info = (Get-Item $exe).VersionInfo
          Write-Host "rtmapp.exe: ProductName '$($info.ProductName)', FileDescription '$($info.FileDescription)', ProductVersion '$($info.ProductVersion)'"
          if ($info.ProductName -ne 'Rusty Todo.txt Manager') { throw 'rtmapp.exe has no embedded version information (build.rs).' }

          # Smoke launch with a sample todo.txt: still running after 5 s means it got a window and an
          # adapter (WARP if the runner has no GPU). A warning only, as the runner's desktop session
          # is not under our control. The release exe has no console, so stderr goes to a log.
          $todo = Join-Path $env:RUNNER_TEMP 'todo.txt'
          Set-Content -Path $todo -Value @('(A) Smoke test +rtm @ci', 'x 2026-10-29 Done item')
          New-Item -ItemType Directory -Force -Path (Join-Path $env:APPDATA 'rtm') | Out-Null
          Set-Content -Path (Join-Path $env:APPDATA 'rtm\config.toml') -Value "file_name = '$todo'"
          $env:RUST_LOG = 'info'
          $app = $null
          try {
            $app = Start-Process $exe -PassThru -RedirectStandardError 'smoke-windows.log'
            $null = $app.Handle  # without an open handle, ExitCode stays empty after the exit
            Start-Sleep -Seconds 5
            if ($app.HasExited) { throw "rtmapp.exe exited within 5 s with exit code $($app.ExitCode)." }
            Write-Host 'Smoke launch: rtmapp.exe is running after 5 s.'
          } catch {
            Write-Host "::warning::Smoke launch failed: $_"
          } finally {
            # Before the uninstall: a running exe would keep its files.
            if ($app -and -not $app.HasExited) { Stop-Process -Id $app.Id -ErrorAction SilentlyContinue; $app.WaitForExit() }
            if (Test-Path 'smoke-windows.log') { Get-Content 'smoke-windows.log' }
          }

          Invoke-Msiexec @('/x', $products[0].Code) 'uninstall-fresh.log'
          if ((Get-Installed).Count -ne 0) { throw 'The product is still registered after uninstalling.' }
          if (Test-Path -LiteralPath $exe) { throw "Still present after uninstalling: $exe" }

      # The new MSI must replace a Tauri install instead of sitting beside it, and keep its folder:
      # installs v0.1.3 into a custom folder, then the new MSI over it without naming a folder, and
      # expects one product at the new version, in the custom folder. Runs even if the fresh install
      # failed, so one run answers both questions.
      - name: Verify upgrade from the v0.1.3 Tauri MSI
        if: always()
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $customDir = 'C:\RtmCustom\'
          $exe = Join-Path $customDir 'rtmapp.exe'

          function Invoke-Msiexec([string[]] $arguments, [string] $log) {
            $p = Start-Process msiexec.exe -ArgumentList ($arguments + @('/qn', '/norestart', '/l*v', $log)) -Wait -PassThru
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              Get-Content $log -Tail 60
              throw "msiexec $($arguments -join ' ') failed with exit code $($p.ExitCode)."
            }
          }
          # Installed products of that name, from the uninstall entries Windows Installer writes.
          function Get-Installed {
            @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq 'Rusty Todo.txt Manager' } |
              ForEach-Object { [pscustomobject]@{ Code = [string]$_.PSChildName; Version = [string]$_.DisplayVersion } })
          }

          # A failed fresh-install step may have left its product behind.
          foreach ($leftover in Get-Installed) { Invoke-Msiexec @('/x', $leftover.Code) 'uninstall-leftover.log' }

          Invoke-Msiexec @('/i', (Resolve-Path 'old-msi/rtmapp_0.1.3_x64_en-US.msi').Path, "INSTALLDIR=$customDir") 'install-old.log'
          $before = Get-Installed
          Write-Host "Installed v0.1.3: $($before | Out-String)"
          if ($before.Count -ne 1) { throw "Expected one product after installing v0.1.3, found $($before.Count)." }

          Invoke-Msiexec @('/i', (Resolve-Path "dist/rtmapp_${env:VERSION}_x64_en-US.msi").Path) 'install-upgrade.log'
          $after = Get-Installed
          Write-Host "After the upgrade: $($after | Out-String)"
          if ($after.Count -ne 1) { throw "Expected one product after the upgrade, found $($after.Count): the new MSI installed beside the old one." }
          if ($after[0].Code -eq $before[0].Code) { throw 'The product code did not change: the new MSI did not replace v0.1.3.' }
          if ($after[0].Version -ne $env:VERSION) { throw "Installed version after the upgrade is '$($after[0].Version)', expected '$env:VERSION'." }
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing after the upgrade: $exe (the install folder was not kept)." }

          Invoke-Msiexec @('/x', $after[0].Code) 'uninstall-upgrade.log'

      # The upgrade users will actually make: the previous release's MSI in the default folder, then
      # the new one over it. Skipped for v0.1.3, which the step above covers, unless a manual run
      # names it with the `previous` input.
      - name: Verify upgrade from the previous release
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
          PREVIOUS_INPUT: ${{ inputs.previous }}
        run: |
          if (-not $env:PREVIOUS) { Write-Host '::notice::No previous release: upgrade test skipped.'; exit 0 }
          if ($env:PREVIOUS -eq 'v0.1.3' -and -not $env:PREVIOUS_INPUT) {
            Write-Host '::notice::The previous release is v0.1.3, covered by the Tauri MSI upgrade step: skipped.'
            exit 0
          }
          $oldVersion = $env:PREVIOUS -replace '^v', ''
          $asset = "rtmapp_${oldVersion}_x64_en-US.msi"
          $assets = (gh release view $env:PREVIOUS --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json).assets.name
          if ($LASTEXITCODE -ne 0) { throw "gh release view $env:PREVIOUS failed ($LASTEXITCODE)." }
          if ($assets -notcontains $asset) { Write-Host "::notice::$env:PREVIOUS has no $asset`: upgrade test skipped."; exit 0 }

          $exe = Join-Path $env:ProgramFiles 'Rusty Todo.txt Manager\rtmapp.exe'

          function Invoke-Msiexec([string[]] $arguments, [string] $log) {
            $p = Start-Process msiexec.exe -ArgumentList ($arguments + @('/qn', '/norestart', '/l*v', $log)) -Wait -PassThru
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              Get-Content $log -Tail 60
              throw "msiexec $($arguments -join ' ') failed with exit code $($p.ExitCode)."
            }
          }
          # Installed products of that name, from the uninstall entries Windows Installer writes.
          function Get-Installed {
            @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq 'Rusty Todo.txt Manager' } |
              ForEach-Object { [pscustomobject]@{ Code = [string]$_.PSChildName; Version = [string]$_.DisplayVersion } })
          }

          foreach ($leftover in Get-Installed) { Invoke-Msiexec @('/x', $leftover.Code) 'uninstall-leftover-previous.log' }
          # A folder remembered from the step above would send this install there instead of the default.
          $key = 'HKCU:\Software\brcha\Rusty Todo.txt Manager'
          $remembered = (Get-ItemProperty $key -Name InstallDir -ErrorAction SilentlyContinue).InstallDir
          if ($remembered) {
            Write-Host "Removing the remembered install folder '$remembered'."
            Remove-ItemProperty $key -Name InstallDir
          }

          gh release download $env:PREVIOUS --repo $env:GITHUB_REPOSITORY --pattern $asset --dir previous-msi
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed ($LASTEXITCODE)." }

          Invoke-Msiexec @('/i', (Resolve-Path "previous-msi/$asset").Path) 'install-previous.log'
          $before = Get-Installed
          Write-Host "Installed ${env:PREVIOUS}: $($before | Out-String)"
          if ($before.Count -ne 1) { throw "Expected one product after installing $env:PREVIOUS, found $($before.Count)." }

          Invoke-Msiexec @('/i', (Resolve-Path "dist/rtmapp_${env:VERSION}_x64_en-US.msi").Path) 'install-upgrade-previous.log'
          $after = Get-Installed
          Write-Host "After the upgrade: $($after | Out-String)"
          if ($after.Count -ne 1) { throw "Expected one product after the upgrade, found $($after.Count): the new MSI installed beside the old one." }
          if ($after[0].Code -eq $before[0].Code) { throw "The product code did not change: the new MSI did not replace $env:PREVIOUS." }
          if ($after[0].Version -ne $env:VERSION) { throw "Installed version after the upgrade is '$($after[0].Version)', expected '$env:VERSION'." }
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing after the upgrade: $exe" }

          Invoke-Msiexec @('/x', $after[0].Code) 'uninstall-upgrade-previous.log'

      - name: Upload MSI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msi-logs
          path: '*.log'
          if-no-files-found: ignore

      # Handed off to the shared `publish` job rather than uploaded/released here directly.
      # Calling softprops/action-gh-release independently from each platform job would race to
      # create the same tagged release -- publish happens exactly once, after all finish.
      - name: Upload windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  # Every Linux package (two debs, two RPMs, the AppImage) comes from one pair of binaries, built
  # in an AlmaLinux 9 container: its glibc (2.34) is the floor the packages need, low enough for
  # RHEL 9 and Ubuntu 22.04 alike. The packages are tested in linux-deb and linux-rpm.
  linux:
    needs: version
    runs-on: ubuntu-latest
    container: almalinux:9
    timeout-minutes: 40

    steps:
      # git for a real checkout, file for appimagetool, tar and zstd for the cache. Neither crate
      # links a native library, so nothing else.
      - name: Install build tools
        run: dnf install -y --quiet gcc git file tar zstd

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Own key: a cache from the earlier Ubuntu build (glibc 2.35) must not leak into this one.
      - uses: Swatinem/rust-cache@v2
        with:
          key: almalinux-9

      # Compiled from source, not installed via a prebuilt-binary action (RTM-29). cargo-deb's
      # only published asset is a single amd64 .deb, built by upstream CI on ubuntu-latest --
      # which has been noble (24.04, glibc 2.39) since GitHub's runner migration. This job builds
      # on AlmaLinux 9 (glibc 2.34) by deliberate choice (see "Linux (RTM-8)" in root AGENTS.md),
      # so that prebuilt binary cannot run here (RTM-29 hit `GLIBC_2.39' not found` on jammy). No
      # older cargo-deb release fixes this either -- upstream has built on ubuntu-latest since well
      # before the runner migration, so every recent release has the same mismatch. Compiling
      # locally is correct by construction, since it links against this container's own glibc.
      # Version pinned so a future cargo-deb release can't silently change behaviour mid-run;
      # --locked uses cargo-deb's own Cargo.lock for reproducible dependency resolution.
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version 3.7.0

      # Compiled for the same reasons as cargo-deb above (RTM-29). It writes the RPMs itself: no
      # rpmbuild or spec file to install.
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked --version 0.21.1

      - name: Build rtmapp and rtmcli
        run: cargo build --release -p rtmapp -p rtmcli

      # Both debs are described in [package.metadata.deb] of their crate's Cargo.toml, including
      # the package name. --no-build reuses the binaries from the step above. --deb-revision=""
      # drops cargo-deb's default "-1" revision suffix. --output writes straight to the final
      # staged name: cargo-deb's default output directory is `target/debian/` (NOT
      # `target/release/debian/` -- RTM-30 failed on exactly that wrong assumption), so naming
      # the destination explicitly removes any dependence on where it would otherwise land.
      - name: Package the debs
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo deb -p rtmapp --no-build --deb-revision="" --output "dist/rtmapp_${VERSION}_amd64.deb"
          cargo deb -p rtmcli --no-build --deb-revision="" --output "dist/rtmcli_${VERSION}_amd64.deb"

      # Described in [package.metadata.generate-rpm] of each crate's Cargo.toml. Like cargo-deb it
      # packages the binaries built above and builds nothing itself. Release "1" is set there.
      # --auto-req builtin: the ldd-based glibc requirements, whatever rpm tooling is installed.
      - name: Package the RPMs
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cargo generate-rpm -p rtmapp --auto-req builtin --output "dist/rtmapp-${VERSION}-1.x86_64.rpm"
          cargo generate-rpm -p rtmcli --auto-req builtin --output "dist/rtmcli-${VERSION}-1.x86_64.rpm"

      # The script downloads appimagetool and the type2 runtime from pinned, checksummed
      # releases -- a network dependency in the release path, bounded by the step timeout.
      - name: Build rtmapp AppImage
        timeout-minutes: 10
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/build-appimage.sh target/release/rtmapp "$VERSION" "dist/rtmapp_${VERSION}_amd64.AppImage"

      # Fail loudly if an asset is missing rather than silently shipping without it.
      - name: Check staged artifacts
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for f in "dist/rtmapp_${VERSION}_amd64.deb" \
                   "dist/rtmcli_${VERSION}_amd64.deb" \
                   "dist/rtmapp-${VERSION}-1.x86_64.rpm" \
                   "dist/rtmcli-${VERSION}-1.x86_64.rpm" \
                   "dist/rtmapp_${VERSION}_amd64.AppImage"; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected release artifact missing after staging: $f"
              exit 1
            fi
          done

          echo 'Staged artifacts:'
          ls -la dist

      - name: Upload linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  # The debs on the oldest Ubuntu they target, from the binaries built in the linux job; the X11
  # and Wayland smoke launches start the binary every Linux package ships. Then the AppImage.
  linux-deb:
    needs: [version, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-linux
          path: dist

      # Nothing is built here. The package index is refreshed because the install check below
      # resolves the debs' Depends from it. Same hardened apt pattern as before (RTM-28) -- pin the
      # mirror, bound retries and timeouts.
      - name: Refresh the apt index
        timeout-minutes: 10
        run: |
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15

      # Building a .deb is not evidence it installs. Installing both with apt resolves every
      # Depends from the jammy index, so a wrong package name fails here. Also checks that the
      # hand-written libc6 floor (cargo-deb's $auto needs dpkg-shlibdeps, which AlmaLinux lacks)
      # covers the newest glibc symbol each binary uses, and that a portal backend with a file
      # chooser came with rtmapp.
      - name: Verify packages install
        timeout-minutes: 10
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          deb="dist/rtmapp_${VERSION}_amd64.deb"
          dpkg-deb --info "$deb"

          pkg=$(dpkg-deb --field "$deb" Package)
          if [ "$pkg" != "rtmapp" ]; then
            echo "::error::Expected the rtmapp .deb to report Package: rtmapp, got '$pkg'."
            exit 1
          fi

          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
            "./dist/rtmcli_${VERSION}_amd64.deb" "./$deb"

          rtmcli --help

          for name in rtmapp rtmcli; do
            floor=$(dpkg-deb --field "dist/${name}_${VERSION}_amd64.deb" Depends | grep -oP 'libc6 \(>= \K[0-9.]+')
            needed=$(objdump -T "/usr/bin/$name" | grep -oP 'GLIBC_\K[0-9.]+' | sort -uV | tail -1)
            echo "$name: needs glibc $needed, its deb depends on libc6 >= $floor."
            if [ "$(printf '%s\n' "$floor" "$needed" | sort -V | tail -1)" != "$floor" ]; then
              echo "::error::$name needs glibc $needed but its deb only requires libc6 >= $floor."
              exit 1
            fi
          done

          if [ ! -x /usr/bin/rtmapp ]; then
            echo "::error::/usr/bin/rtmapp missing or not executable after install."
            exit 1
          fi
          if ! grep -q '^Exec=rtmapp' /usr/share/applications/rtmapp.desktop; then
            echo "::error::/usr/share/applications/rtmapp.desktop missing or without Exec=rtmapp."
            exit 1
          fi
          for size in 16x16 24x24 32x32 128x128 256x256 512x512; do
            if [ ! -f "/usr/share/icons/hicolor/$size/apps/rtmapp.png" ]; then
              echo "::error::Icon missing after install: hicolor/$size/apps/rtmapp.png"
              exit 1
            fi
          done
          if ! grep -l 'org.freedesktop.impl.portal.FileChooser' /usr/share/xdg-desktop-portal/portals/*.portal; then
            echo "::error::No installed XDG portal backend implements the file chooser."
            exit 1
          fi

      # Smoke launch of the installed app on X11 (the fallback without WAYLAND_DISPLAY), under Xvfb
      # with Mesa software rendering: lavapipe for Vulkan, llvmpipe for GL. Still running after 5 s
      # with its window mapped means it got a surface and an adapter; RUST_LOG=info logs which one.
      # The 24-bit screen is explicit: older xvfb-run scripts default to 8 bit, which has no visual
      # GL or Vulkan can use. The X11 libraries are the rtmapp deb's Suggests.
      - name: Smoke launch on X11
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
            xvfb x11-utils libgl1-mesa-dri libegl-mesa0 mesa-vulkan-drivers \
            libx11-6 libx11-xcb1 libxcursor1 libxi6 libxkbcommon-x11-0

          # Also used by the Wayland launch below.
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke/rtm"
          printf '(A) Smoke test +rtm @ci\nx 2026-10-29 Done item\n' > "$smoke/todo.txt"
          printf 'file_name = "%s"\n' "$smoke/todo.txt" > "$smoke/rtm/config.toml"

          status=0
          # shellcheck disable=SC2016 # the inner script expands its own variables
          env -u WAYLAND_DISPLAY XDG_CONFIG_HOME="$smoke" RUST_LOG=info,zbus=warn,tracing=warn LIBGL_ALWAYS_SOFTWARE=1 SMOKE_LOG="$smoke/x11.log" \
            xvfb-run -a -s '-screen 0 1280x1024x24' bash -c '
              rtmapp 2> "$SMOKE_LOG" &
              pid=$!
              trap "kill $pid 2> /dev/null" EXIT
              sleep 5
              if ! kill -0 "$pid" 2> /dev/null; then
                echo "::error::rtmapp exited within 5 s on X11."
                exit 1
              fi
              if ! xwininfo -root -tree | grep -F "\"Rusty Todo.txt Manager\""; then
                echo "::error::rtmapp is running on X11 but has no window."
                exit 1
              fi
              echo "Smoke launch: rtmapp is running on X11 after 5 s."
              kill "$pid"
              wait "$pid" 2> /dev/null
              exit 0
            ' || status=$?
          cat "$smoke/x11.log"
          exit "$status"

      # The same on Wayland, the main path, under a headless Weston (Weston 9 on jammy names the
      # backend by its module). Non-blocking: without a GPU there is no dmabuf, and whether wgpu
      # finds a software path that Weston accepts is not guaranteed. A failure shows as a warning.
      - name: Smoke launch on Wayland
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          # Not -e (the default shell sets it): the kill in the trap and the wait may fail harmlessly.
          set +e -uo pipefail
          smoke="$RUNNER_TEMP/smoke"
          fail() { echo "::warning::Wayland smoke launch failed: $1"; exit 1; }
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
            weston || fail 'could not install weston'

          XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          export XDG_RUNTIME_DIR
          weston --version
          # The default (no-op) renderer: with --use-pixman, jammy's Weston 9.0.0 segfaulted once rtmapp
          # connected and drew.
          weston --backend=headless-backend.so --socket=wayland-rtm --idle-time=0 > "$smoke/weston.log" 2>&1 &
          weston_pid=$!
          app_pid=
          trap 'kill ${app_pid:+"$app_pid"} "$weston_pid" 2> /dev/null; cat "$smoke/weston.log" "$smoke/wayland.log" 2> /dev/null' EXIT

          for _ in $(seq 20); do
            [ -S "$XDG_RUNTIME_DIR/wayland-rtm" ] && break
            sleep 0.5
          done
          [ -S "$XDG_RUNTIME_DIR/wayland-rtm" ] || fail 'Weston did not create its socket'
          sleep 1
          kill -0 "$weston_pid" 2> /dev/null || fail 'Weston exited before any client connected'

          WAYLAND_DISPLAY=wayland-rtm XDG_CONFIG_HOME="$smoke" RUST_LOG=info,zbus=warn,tracing=warn rtmapp 2> "$smoke/wayland.log" &
          app_pid=$!
          sleep 5
          kill -0 "$weston_pid" 2> /dev/null || fail 'Weston exited after rtmapp connected'
          kill -0 "$app_pid" 2> /dev/null || fail 'rtmapp exited within 5 s'
          echo 'Smoke launch: rtmapp is running on Wayland after 5 s.'
          kill "$app_pid"
          wait "$app_pid" 2> /dev/null
          exit 0

      # The upgrade users will actually make: the previous release's debs, then the new ones over
      # them. Runs after the fresh install above, which proves the Depends resolve from nothing (an
      # upgrade could mask a missing one). Unlike on Windows, v0.1.3 is not skipped: it is the Tauri
      # deb (also named rtmapp) and nothing else tests that upgrade. Its webkit2gtk dependencies make
      # this the slowest apt step while v0.1.3 is the previous release.
      - name: Verify upgrade from the previous release
        if: always()
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS" ]; then
            echo "::notice::No previous release: upgrade test skipped."
            exit 0
          fi
          old="${PREVIOUS#v}"
          assets=$(gh release view "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in "rtmapp_${old}_amd64.deb" "rtmcli_${old}_amd64.deb"; do
            if ! grep -qxF "$asset" <<< "$assets"; then
              echo "::notice::$PREVIOUS has no $asset: upgrade test skipped."
              exit 0
            fi
          done

          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get purge -y rtmapp rtmcli
          gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --pattern '*_amd64.deb' --dir previous-debs
          sudo apt-get install -y "${apt_opts[@]}" \
            "./previous-debs/rtmapp_${old}_amd64.deb" "./previous-debs/rtmcli_${old}_amd64.deb"
          sudo apt-get install -y "${apt_opts[@]}" \
            "./dist/rtmapp_${VERSION}_amd64.deb" "./dist/rtmcli_${VERSION}_amd64.deb"

          for pkg in rtmapp rtmcli; do
            installed=$(dpkg-query -W -f='${Version}' "$pkg")
            echo "$pkg after the upgrade: $installed"
            if [ "$installed" != "$VERSION" ]; then
              echo "::error::$pkg is at '$installed' after upgrading from $PREVIOUS, expected '$VERSION'."
              exit 1
            fi
          done

      # The AppImage holds the same binary the smoke launches above ran, so it is only extracted:
      # that proves it is well-formed rather than a truncated or corrupt build. Artifacts do not
      # keep file modes, hence the chmod.
      - name: Verify AppImage integrity
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          appimage="$PWD/dist/rtmapp_${VERSION}_amd64.AppImage"
          chmod +x "$appimage"

          rm -rf appimage-extract-test
          mkdir -p appimage-extract-test
          cd appimage-extract-test
          "$appimage" --appimage-extract > /dev/null

          for f in AppRun rtmapp.desktop rtmapp.png usr/bin/rtmapp; do
            if [ ! -e "squashfs-root/$f" ]; then
              echo "::error::Extracted AppImage is missing $f."
              exit 1
            fi
          done

  # The RPMs on each distribution they target, one job container per image, from the binaries
  # built in the linux job. They name their libraries by soname (and the portal packages by names
  # the distributions share), so one package serves Fedora, RHEL and openSUSE. Fedora and
  # AlmaLinux: the oldest supported release up to the newest; bump the tags as releases end.
  # Tumbleweed is rolling: a failure there can come from Tumbleweed rather than this change.
  linux-rpm:
    needs: [version, linux]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - fedora:43
          - fedora:44
          - almalinux:9
          - almalinux:10
          - registry.opensuse.org/opensuse/leap:16.0
          - registry.opensuse.org/opensuse/tumbleweed

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-linux
          path: dist

      # Installing both from the image's default repositories resolves every Requires; then the
      # files. The smoke launches in linux-deb start the same binary.
      - name: Verify RPMs install
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          rpms=("$PWD/dist/rtmapp-${VERSION}-1.x86_64.rpm" "$PWD/dist/rtmcli-${VERSION}-1.x86_64.rpm")
          if command -v zypper > /dev/null; then
            zypper --non-interactive --quiet install --allow-unsigned-rpm "${rpms[@]}"
          else
            dnf install -y --quiet "${rpms[@]}"
          fi
          for pkg in rtmapp rtmcli; do
            installed=$(rpm -q --qf "%{VERSION}-%{RELEASE}" "$pkg")
            if [ "$installed" != "${VERSION}-1" ]; then
              echo "::error::$pkg is at $installed, expected ${VERSION}-1."
              exit 1
            fi
            if ! rpm -qR "$pkg" | grep "^libc\.so\.6(GLIBC_" > /dev/null; then
              echo "::error::The $pkg RPM has no versioned glibc requirement: auto-req did not run."
              exit 1
            fi
          done
          rtmcli --help > /dev/null
          if [ ! -x /usr/bin/rtmapp ]; then
            echo "::error::/usr/bin/rtmapp missing or not executable after install."
            exit 1
          fi
          if ! grep -q "^Exec=rtmapp" /usr/share/applications/rtmapp.desktop; then
            echo "::error::/usr/share/applications/rtmapp.desktop missing or without Exec=rtmapp."
            exit 1
          fi
          for size in 16x16 24x24 32x32 128x128 256x256 512x512; do
            if [ ! -f "/usr/share/icons/hicolor/$size/apps/rtmapp.png" ]; then
              echo "::error::Icon missing after install: hicolor/$size/apps/rtmapp.png"
              exit 1
            fi
          done
          if [ ! -f /usr/share/licenses/rtmapp/LICENSE ]; then
            echo "::error::/usr/share/licenses/rtmapp/LICENSE missing after install."
            exit 1
          fi
          if ! grep -l org.freedesktop.impl.portal.FileChooser /usr/share/xdg-desktop-portal/portals/*.portal; then
            echo "::error::No installed XDG portal backend implements the file chooser."
            exit 1
          fi

      # The same skip logic as the deb upgrade in linux-deb, on the oldest Fedora only. Installing
      # the newer RPM over the older one with dnf upgrades it in place. No release before RTM-9 has
      # RPMs, so this skips until the second release that has them.
      - name: Verify RPM upgrade from the previous release
        if: matrix.image == 'fedora:43'
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS" ]; then
            echo "::notice::No previous release: RPM upgrade test skipped."
            exit 0
          fi
          dnf install -y --quiet gh
          old="${PREVIOUS#v}"
          assets=$(gh release view "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in "rtmapp-${old}-1.x86_64.rpm" "rtmcli-${old}-1.x86_64.rpm"; do
            if ! grep -qxF "$asset" <<< "$assets"; then
              echo "::notice::$PREVIOUS has no $asset: RPM upgrade test skipped."
              exit 0
            fi
          done

          # The install check above left the new RPMs installed.
          dnf remove -y --quiet rtmapp rtmcli
          gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --pattern '*.x86_64.rpm' --dir previous-rpms
          dnf install -y --quiet "previous-rpms/rtmapp-${old}-1.x86_64.rpm" "previous-rpms/rtmcli-${old}-1.x86_64.rpm"
          dnf install -y --quiet "dist/rtmapp-${VERSION}-1.x86_64.rpm" "dist/rtmcli-${VERSION}-1.x86_64.rpm"
          for pkg in rtmapp rtmcli; do
            installed=$(rpm -q --qf '%{VERSION}-%{RELEASE}' "$pkg")
            echo "$pkg after the upgrade: $installed"
            if [ "$installed" != "${VERSION}-1" ]; then
              echo "::error::$pkg is at $installed after upgrading from ${old}-1, expected ${VERSION}-1."
              exit 1
            fi
          done

  # One universal (arm64 + x86_64) dmg for rtmapp and one tarball for rtmcli, built on the arm64
  # runner by cross-compiling the x86_64 slice. Ad-hoc signed only: no Developer ID yet (RTM-54).
  # No upgrade test: replacing a .app carries no installer state, and no earlier release has one.
  macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Both slices; also the value of LSMinimumSystemVersion in rtmapp/assets/Info.plist.
      MACOSX_DEPLOYMENT_TARGET: '11.0'

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build rtmapp and rtmcli
        run: |
          cargo build --release -p rtmapp -p rtmcli --target aarch64-apple-darwin
          cargo build --release -p rtmapp -p rtmcli --target x86_64-apple-darwin

      # The bundle is signed by build-macos.sh; rtmcli ships bare, so it is signed here.
      - name: Join the universal binaries
        run: |
          mkdir -p target/universal
          for bin in rtmapp rtmcli; do
            lipo -create -output "target/universal/$bin" \
              "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
          done
          codesign --force --sign - --timestamp=none target/universal/rtmcli

      - name: Package the dmg and the rtmcli tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/build-macos.sh target/universal/rtmapp "$VERSION" "dist/rtmapp_${VERSION}_universal.dmg"
          stage="$RUNNER_TEMP/rtmcli"
          mkdir -p "$stage"
          cp target/universal/rtmcli LICENSE "$stage/"
          tar -czf "dist/rtmcli-${VERSION}-macos-universal.tar.gz" -C "$stage" rtmcli LICENSE

      # Fail loudly if an asset is missing rather than silently shipping without it.
      - name: Check staged artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for f in "dist/rtmapp_${VERSION}_universal.dmg" \
                   "dist/rtmcli-${VERSION}-macos-universal.tar.gz"; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected release artifact missing after staging: $f"
              exit 1
            fi
          done

          echo 'Staged artifacts:'
          ls -la dist

      # Installs the app from the dmg the way a user does (copy to /Applications), then checks the
      # bundle: Info.plist values, both slices, the deployment target, the signature and the
      # resources. Then the tarball's rtmcli runs, natively and under Rosetta when it is installed.
      - name: Verify packages
        timeout-minutes: 10
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          name='Rusty Todo.txt Manager'
          app="/Applications/$name.app"

          mnt="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "dist/rtmapp_${VERSION}_universal.dmg"
          [ -d "$mnt/$name.app" ] || fail "The dmg has no $name.app."
          [ "$(readlink "$mnt/Applications")" = /Applications ] || fail 'The dmg has no link to /Applications.'
          ditto "$mnt/$name.app" "$app"
          hdiutil detach "$mnt" || hdiutil detach -force "$mnt"

          plist="$app/Contents/Info.plist"
          check_key() {
            value=$(plutil -extract "$1" raw -o - "$plist")
            echo "$1 = $value"
            [ "$value" = "$2" ] || fail "Info.plist has $1 = '$value', expected '$2'."
          }
          check_key CFBundleIdentifier com.brcha.rtm
          check_key CFBundleExecutable rtmapp
          check_key CFBundleShortVersionString "$VERSION"
          check_key CFBundleVersion "$VERSION"
          check_key LSMinimumSystemVersion "$MACOSX_DEPLOYMENT_TARGET"

          for f in rtmapp.icns LICENSE Inter-LICENSE.txt; do
            [ -f "$app/Contents/Resources/$f" ] || fail "The bundle has no Contents/Resources/$f."
          done

          codesign --verify --deep --strict --verbose=2 "$app"

          cli="$RUNNER_TEMP/rtmcli-extract"
          mkdir -p "$cli"
          tar -xzf "dist/rtmcli-${VERSION}-macos-universal.tar.gz" -C "$cli"
          [ -f "$cli/LICENSE" ] || fail 'The rtmcli tarball has no LICENSE.'
          codesign --verify --strict --verbose=2 "$cli/rtmcli"

          # lipo lists the slices in the order they were joined; check each one is there.
          for bin in "$app/Contents/MacOS/rtmapp" "$cli/rtmcli"; do
            archs=$(lipo -archs "$bin")
            echo "$bin: $archs"
            for arch in arm64 x86_64; do
              case " $archs " in
                *" $arch "*) ;;
                *) fail "$bin has no $arch slice." ;;
              esac
              # Captured first: grep -q in a pipe can SIGPIPE vtool, which pipefail reports.
              build=$(vtool -arch "$arch" -show-build "$bin")
              grep -q "minos $MACOSX_DEPLOYMENT_TARGET" <<< "$build" \
                || fail "The $arch slice of $bin does not target macOS $MACOSX_DEPLOYMENT_TARGET."
            done
          done

          "$cli/rtmcli" --help
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            arch -x86_64 "$cli/rtmcli" --help
          else
            echo '::notice::Rosetta is not installed: the x86_64 slice of rtmcli was not run.'
          fi

      # Starts the installed app through Launch Services with a sample todo.txt (the runner's home is
      # ephemeral, so its real config path is used) and expects it running after 5 s. A window check
      # would need Accessibility permission for osascript, which the runner does not grant.
      - name: Smoke launch
        timeout-minutes: 10
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/smoke"
          config="$HOME/Library/Application Support/rtm"
          mkdir -p "$smoke" "$config"
          printf '(A) Smoke test +rtm @ci\nx 2026-10-29 Done item\n' > "$smoke/todo.txt"
          printf 'file_name = "%s"\n' "$smoke/todo.txt" > "$config/config.toml"

          open -n -a '/Applications/Rusty Todo.txt Manager.app' \
            --env RUST_LOG=info,zbus=warn,tracing=warn --stderr "$smoke/stderr.log"
          sleep 5
          status=0
          if pgrep -x rtmapp; then
            echo 'Smoke launch: rtmapp is running after 5 s.'
            pkill -x rtmapp
          else
            echo '::error::rtmapp is not running 5 s after it was opened.'
            status=1
          fi
          cat "$smoke/stderr.log" 2> /dev/null || true
          exit "$status"

      - name: Upload macos artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  # Single point of publication for all platforms -- avoids two concurrent jobs racing to
  # create or update the same tagged GitHub Release. Pull requests stop after the platform jobs.
  publish:
    if: github.event_name != 'pull_request'
    needs: [version, windows, linux, linux-deb, linux-rpm, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List staged artifacts
        run: ls -la dist

      # Manual run outside a release branch: dry run. Upload for inspection, do not touch
      # Releases, do not burn a version tag.
      - name: Upload dry-run artifacts
        if: needs.version.outputs.mode == 'dry-run'
        uses: actions/upload-artifact@v7
        with:
          name: rtm-${{ needs.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      # Release (tag push, or a manual run on a release branch): publish as a draft. The maintainer
      # reviews and publishes it manually, so a broken release can never become permanent. For a
      # manual run the tag does not exist yet: GitHub creates it on the built commit when the draft
      # is published. The body is the version's section of CHANGELOG.md (see Check the release).
      - name: Publish draft release
        if: needs.version.outputs.mode == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ needs.version.outputs.latest }}
          draft: true
          body: ${{ needs.version.outputs.notes }}
          files: dist/*

  # The check the main ruleset requires (RTM-76): passes when the package builds passed, or were
  # skipped because the pull request changes nothing that goes into the packages; fails when any
  # of them failed or was cancelled.
  release:
    if: always()
    needs: [changes, version, windows, linux, linux-deb, linux-rpm, macos]
    runs-on: ubuntu-latest

    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
