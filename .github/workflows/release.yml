name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Extracted into its own job so a second platform job (Linux) can depend on the same
  # tag-vs-manifest check via `needs:` instead of duplicating the PowerShell. Runs on
  # ubuntu-latest purely as a cheap host for pwsh; it builds nothing.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # The committed manifest is the single source of truth for the release version — this
      # workflow never writes to it. rtmapp/src-tauri/tauri.conf.json is read directly (it's what
      # drives MSI ProductVersion and exe metadata); on a tag push, the tag is required to match
      # exactly, so a forgotten version bump fails the build loudly instead of shipping an MSI
      # whose ProductVersion silently disagrees with its own release filename.
      - name: Determine and verify release version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $confPath = 'rtmapp/src-tauri/tauri.conf.json'
          $content = Get-Content -Raw -Path $confPath
          $match = [regex]::Match($content, '(?m)^  "version": "([^"]*)"')
          if (-not $match.Success) {
            throw "Could not find a top-level `"version`" key in $confPath."
          }
          $version = $match.Groups[1].Value
          Write-Host "Committed version (from ${confPath}): $version"

          if ($env:EVENT_NAME -eq 'push') {
            $tagVersion = $env:TAG_NAME -replace '^[vV]', ''
            if ($tagVersion -ne $version) {
              throw "Tag '$env:TAG_NAME' (version '$tagVersion') does not match the version " +
                    "committed in $confPath ('$version'). Bump the version with " +
                    "scripts/set-version.ps1, commit it, and only then tag the release."
            }
            Write-Host "Tag matches committed version."
          } else {
            Write-Host "workflow_dispatch dry run: building committed version as-is, no tag to verify against."
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

  windows:
    needs: version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: rtmapp/package-lock.json

      - name: Install frontend/CLI dependencies
        working-directory: rtmapp
        run: npm ci

      - name: Build rtmcli
        run: cargo build --release -p rtmcli

      # Unsigned for now (RTM-10). To sign later: add `bundle.windows.signCommand` or
      # `certificateThumbprint` to rtmapp/src-tauri/tauri.conf.json, feed the certificate and
      # password through repository secrets, and reference them here via an `env:` block, e.g.
      #   env:
      #     WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      #     WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Build rtmapp MSI
        working-directory: rtmapp
        run: npm run tauri build -- --bundles msi

      # Stages the two release assets under stable, predictable names, and asserts each one
      # exists before upload. A glob that silently matches nothing (or a stale binary from an
      # earlier, differently-configured build) must fail the job, not produce a green release
      # with missing or wrong assets. rtmapp.exe is deliberately not staged here — the MSI
      # installs the same binary, so shipping it loose is redundant. rtmcli.exe stays: the MSI
      # only packages rtmapp, so the raw binary is the sole channel for the CLI on Windows.
      - name: Stage release artifacts
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $msiCandidates = Get-ChildItem -Path 'target/release/bundle/msi' -Filter '*.msi' -ErrorAction Stop
          if ($msiCandidates.Count -ne 1) {
            throw "Expected exactly one MSI in target/release/bundle/msi, found $($msiCandidates.Count)."
          }
          Copy-Item $msiCandidates[0].FullName "dist/rtmapp_${env:VERSION}_x64_en-US.msi"
          Copy-Item 'target/release/rtmcli.exe' "dist/rtmcli-${env:VERSION}-x64.exe" -ErrorAction Stop

          $expected = @(
            "dist/rtmapp_${env:VERSION}_x64_en-US.msi",
            "dist/rtmcli-${env:VERSION}-x64.exe"
          )
          foreach ($f in $expected) {
            if (-not (Test-Path -LiteralPath $f)) {
              throw "Expected release artifact missing after staging: $f"
            }
          }

          Write-Host 'Staged artifacts:'
          Get-ChildItem dist | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

      # Handed off to the shared `publish` job rather than uploaded/released here directly.
      # With a second platform job (linux) producing its own dist/, calling
      # softprops/action-gh-release independently from both would race to create the same
      # tagged release -- publish happens exactly once, after both platforms finish.
      - name: Upload windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # Same hardened apt pattern as .github/workflows/rust.yml (RTM-28) -- pin the mirror,
      # bound retries/timeouts. Do not let this list drift from rust.yml's without a reason.
      # libfuse2 is additional: Tauri's AppImage bundler needs it to run the linuxdeploy
      # AppImage it downloads at build time.
      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgirepository1.0-dev \
            libgl1-mesa-dev \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: rtmapp/package-lock.json

      - name: Install frontend/CLI dependencies
        working-directory: rtmapp
        run: npm ci

      # Compiled from source, not installed via a prebuilt-binary action (RTM-29). cargo-deb's
      # only published asset is a single amd64 .deb, built by upstream CI on ubuntu-latest --
      # which has been noble (24.04, glibc 2.39) since GitHub's runner migration. This runner
      # is jammy (22.04, glibc 2.35) by deliberate choice (see "Linux (RTM-8)" in root
      # AGENTS.md), so that prebuilt binary cannot run here: `GLIBC_2.39' not found`. No older
      # cargo-deb release fixes this either -- upstream has built on ubuntu-latest since well
      # before the runner migration, so every recent release has the same mismatch. Compiling
      # locally is correct by construction, since it links against this runner's own glibc.
      # Version pinned so a future cargo-deb release can't silently change behaviour mid-run;
      # --locked uses cargo-deb's own Cargo.lock for reproducible dependency resolution.
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version 3.7.0

      - name: Build rtmcli
        run: cargo build --release -p rtmcli

      # --no-build reuses the binary from the step above. --deb-revision="" drops cargo-deb's
      # default "-1" revision suffix. --output writes straight to the final staged name:
      # cargo-deb's default output directory is `target/debian/` (NOT `target/release/debian/`
      # -- RTM-30 failed on exactly that wrong assumption), so naming the destination
      # explicitly removes any dependence on where it would otherwise land.
      - name: Package rtmcli deb
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo deb -p rtmcli --no-build --deb-revision="" \
            --output "dist/rtmcli_${VERSION}_amd64.deb"

      # Tauri's AppImage bundler downloads linuxdeploy and appimagetool at build time -- a
      # network dependency in the release path. The step timeout bounds that risk rather
      # than letting it hang the whole job.
      - name: Build rtmapp deb and AppImage
        working-directory: rtmapp
        timeout-minutes: 15
        run: npm run tauri build -- --bundles deb,appimage

      # Tauri has no config option to set the deb's Package: name (verified against the
      # tauri-bundler source, not assumed -- see the implementation plan). It kebab-cases
      # productName for the internal Package: field and uses productName completely
      # unmodified for the filename, so the file Tauri produces here is something like
      # "Rusty Todo.txt Manager_0.1.0_amd64.deb" with internal name
      # "rusty-todo-txt-manager". Glob for it, unpack, retarget Package: to "rtmapp" --
      # matching mainBinaryName and the Nix pname -- and repack directly to the final,
      # correctly named file.
      - name: Repack rtmapp deb with pinned package name
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          raw_debs=(target/release/bundle/deb/*.deb)
          if [ "${#raw_debs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one rtmapp .deb in target/release/bundle/deb, found ${#raw_debs[@]}."
            exit 1
          fi

          dpkg-deb -R "${raw_debs[0]}" rtmapp-deb-extract
          if ! grep -q '^Package: ' rtmapp-deb-extract/DEBIAN/control; then
            echo "::error::No 'Package:' line found in DEBIAN/control."
            exit 1
          fi
          sed -i 's/^Package: .*/Package: rtmapp/' rtmapp-deb-extract/DEBIAN/control

          dpkg-deb -b rtmapp-deb-extract "dist/rtmapp_${VERSION}_amd64.deb"
          if [ ! -f "dist/rtmapp_${VERSION}_amd64.deb" ]; then
            echo "::error::Repacked rtmapp .deb missing after dpkg-deb -b."
            exit 1
          fi

      # Same fail-loudly discipline as the Windows staging step: a glob that matches nothing,
      # or more than one file, must fail the job rather than silently ship a stale or wrong
      # artifact.
      - name: Stage remaining release artifacts
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one AppImage in target/release/bundle/appimage, found ${#appimages[@]}."
            exit 1
          fi
          cp "${appimages[0]}" "dist/rtmapp_${VERSION}_amd64.AppImage"

          for f in "dist/rtmapp_${VERSION}_amd64.deb" \
                   "dist/rtmcli_${VERSION}_amd64.deb" \
                   "dist/rtmapp_${VERSION}_amd64.AppImage"; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected release artifact missing after staging: $f"
              exit 1
            fi
          done

          echo 'Staged artifacts:'
          ls -la dist

      # Building a .deb is not evidence it installs. Prove both packages actually install on
      # a stock system, and prove the repack above really landed a package named "rtmapp"
      # rather than silently reverting to "rusty-todo-txt-manager".
      - name: Verify packages install
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          pkg=$(dpkg-deb --field "dist/rtmapp_${VERSION}_amd64.deb" Package)
          if [ "$pkg" != "rtmapp" ]; then
            echo "::error::Expected repacked rtmapp .deb to report Package: rtmapp, got '$pkg'."
            exit 1
          fi

          # dpkg -i legitimately exits non-zero on unmet dependencies; apt-get -f install
          # resolves them from the runner's apt cache in the next step.
          sudo dpkg -i "dist/rtmcli_${VERSION}_amd64.deb" "dist/rtmapp_${VERSION}_amd64.deb" || true
          sudo apt-get -f install -y

          rtmcli --help

          if [ ! -x /usr/bin/rtmapp ]; then
            echo "::error::/usr/bin/rtmapp missing or not executable after install."
            exit 1
          fi
          if ! grep -rq '^Exec=rtmapp' /usr/share/applications/*.desktop; then
            echo "::error::No installed .desktop entry with Exec=rtmapp found under /usr/share/applications."
            exit 1
          fi

      # A launch requires a display server and is out of scope here. Extraction proves the
      # AppImage is well-formed rather than a truncated download from linuxdeploy/appimagetool.
      - name: Verify AppImage integrity
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          appimage="$PWD/dist/rtmapp_${VERSION}_amd64.AppImage"
          chmod +x "$appimage"

          rm -rf appimage-extract-test
          mkdir -p appimage-extract-test
          cd appimage-extract-test
          "$appimage" --appimage-extract > /dev/null

          if [ ! -f squashfs-root/AppRun ]; then
            echo "::error::Extracted AppImage is missing AppRun."
            exit 1
          fi
          shopt -s nullglob
          desktops=(squashfs-root/*.desktop)
          if [ "${#desktops[@]}" -lt 1 ]; then
            echo "::error::Extracted AppImage contains no .desktop entry."
            exit 1
          fi

      - name: Upload linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  # Single point of publication for both platforms -- avoids two concurrent jobs racing to
  # create or update the same tagged GitHub Release.
  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List staged artifacts
        run: ls -la dist

      # workflow_dispatch: dry run. Upload for inspection, do not touch Releases, do not burn a
      # version tag.
      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rtm-${{ needs.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      # Tag push: publish as a draft. Master reviews and promotes manually, so a broken first
      # release can never become permanent. Release notes are generated from squashed PR titles,
      # which pr-title.yml already forces to be conventional and RTM-tagged.
      - name: Publish draft release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
