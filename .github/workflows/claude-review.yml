name: Claude Review

# Reviews pull requests from branches of this repository when they are opened, reopened or marked
# ready, and again after every push, and posts the findings as comments (RTM-147). It never
# pushes, approves or blocks, and it is not a required check. See "Claude review" in doc/ci.md.
on:
  pull_request:
    branches: [ "main", "releases/**" ]
    types: [ opened, reopened, ready_for_review, synchronize ]

# The review posts through the Claude GitHub App's token, so the workflow token stays read-only.
# id-token: write lets the action exchange the run's OIDC token for the app token.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only pull requests from branches of this repository, which need write access to push, get a
    # review. Pull requests from forks never do; they get no secrets anyway.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1

    # The plugin marketplace, pinned like the actions: the plugin's own frontmatter grants the
    # tools it may use, so an unpinned copy could change what the review is allowed to run.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: anthropics/claude-plugins-official
        ref: ff920a4094a341f282d5dee00daef2c3b8339c72 # main, 2026-11-06
        path: .claude-plugins-official
        persist-credentials: false

    # Claude Code reserves the marketplace name "claude-plugins-official" for copies fetched from
    # Anthropic's GitHub organisation and rejects names that look like it, so the pinned local copy
    # gets a plain name of its own.
    - name: Rename the pinned marketplace
      run: |
        manifest=.claude-plugins-official/.claude-plugin/marketplace.json
        jq '.name = "rtm-review"' "$manifest" > "$RUNNER_TEMP/marketplace.json"
        mv "$RUNNER_TEMP/marketplace.json" "$manifest"

    # Claude's earlier inline comments, so that a review after a push does not repeat them. The
    # review's own tools cannot list inline comments, and giving it `gh api` would hand it the
    # app's write token for any API call; this step reads them with the read-only workflow token.
    - name: Collect earlier Claude comments
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" \
          --jq '.[] | select(.user.login == "claude[bot]") | {path, line, body}' \
          > "$RUNNER_TEMP/claude-earlier-comments.jsonl"

    - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        plugin_marketplaces: ./.claude-plugins-official
        plugins: code-review@rtm-review
        # The plugin checks the changes against CLAUDE.md files; rtm's are named AGENTS.md.
        prompt: |
          /code-review:code-review --comment

          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}

          This repository's guideline files are named AGENTS.md: one at the root and one in
          several subdirectories. Wherever these instructions say CLAUDE.md, use AGENTS.md.

          This workflow reviews the pull request again after every push.
          - In step 1, drop the condition "Claude has already commented on this PR", and tell
            the step-1 agent so. The other conditions stay.
          - Claude's earlier inline comments are in ${{ runner.temp }}/claude-earlier-comments.jsonl,
            one JSON object per line (path, line, body); its earlier summary comments are in
            `gh pr view --comments`. Read both before step 4, pass them to the review agents,
            and do not raise an issue again that one of them already raised. Report only new
            issues in the current version of the pull request.
          - When an earlier Claude review exists and nothing new turns up, post "No new issues
            found since the last review." instead of the usual "no issues" comment.

          EVENT: ${{ github.event.action }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PREVIOUS HEAD (pushes only): ${{ github.event.before }}
        # The plugin's own tools: reading the pull request and posting the review.
        claude_args: |
          --max-turns 60
          --allowedTools "Read,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
