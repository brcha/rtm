name: Claude Review

# Reviews each pull request once, when it is opened, reopened or marked ready, and posts the
# findings as comments (RTM-147). It never pushes, approves or blocks, and it is not a required
# check. See "Claude review" in doc/ci.md.
on:
  pull_request:
    branches: [ "main", "releases/**" ]
    types: [ opened, reopened, ready_for_review ]

# The review posts through the Claude GitHub App's token, so the workflow token stays read-only.
# id-token: write lets the action exchange the run's OIDC token for the app token.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork pull requests get no secrets, so the review could not run there anyway.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1

    # The plugin marketplace, pinned like the actions: the plugin's own frontmatter grants the
    # tools it may use, so an unpinned copy could change what the review is allowed to run.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: anthropics/claude-plugins-official
        ref: ff920a4094a341f282d5dee00daef2c3b8339c72 # main, 2026-11-06
        path: .claude-plugins-official
        persist-credentials: false

    - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        plugin_marketplaces: ./.claude-plugins-official
        plugins: code-review@claude-plugins-official
        # The plugin checks the changes against CLAUDE.md files; rtm's are named AGENTS.md.
        prompt: |
          /code-review:code-review --comment

          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}

          This repository's guideline files are named AGENTS.md: one at the root and one in
          several subdirectories. Wherever these instructions say CLAUDE.md, use AGENTS.md.
        # The plugin's own tools: reading the pull request and posting the review.
        claude_args: |
          --max-turns 60
          --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
