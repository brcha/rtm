name: Nix

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      # Website files (RTM-79) are not inputs of this build.
      - 'site/**'
      - 'scripts/site/**'
      - '.github/workflows/site.yml'
  # Pull requests always run it, so the required gate check below always reports.
  pull_request:
    branches: [ "main", "releases/**" ]

permissions:
  contents: read

jobs:
  # Whether the pull request changes anything the Nix packages are built from (RTM-82). Runs on
  # every event and never under an `if:`: the build jobs need it, and on other events it always
  # reports code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
    - uses: actions/checkout@v7
      if: github.event_name == 'pull_request'
      with:
        fetch-depth: 2
    - id: diff
      shell: bash
      run: |
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          echo code=true >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # HEAD is the pull request's merge commit, HEAD^1 the base it merges into. --no-renames
        # lists both paths of a rename, so renaming a source file to .md still counts as code.
        files=$(git diff --name-only --no-renames HEAD^1 HEAD)
        inputs='^(rtmapp|rtmcli|rtmsync|todotxt)/|^(Cargo\.toml|Cargo\.lock|flake\.nix|flake\.lock|default\.nix|\.github/workflows/nix\.yml)$'
        # No -q at the end: grep -q exits early, and pipefail would read the first grep's
        # SIGPIPE as "no code".
        if grep -E "$inputs" <<< "$files" | grep -v '\.md$' > /dev/null; then
          echo code=true >> "$GITHUB_OUTPUT"
        else
          echo code=false >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

    # The check phase runs the test suites, the sync tests with git and pijul among them.
    - name: Build the flake
      run: nix build -L .#rtmcli .#rtmapp

  # The check the main ruleset requires (RTM-76): passes when the builds passed, or were skipped
  # because the pull request changes none of their inputs; fails when any of them failed or was
  # cancelled.
  nix:
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1
