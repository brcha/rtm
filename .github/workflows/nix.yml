name: Nix

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ '**/*.md' ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ '**/*.md' ]

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

    # The check phase runs the test suites, the sync tests with git and pijul among them.
    - name: Build the flake
      run: nix build -L .#rtmcli .#rtmapp
