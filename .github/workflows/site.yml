name: Site

# The project website (site/, RTM-79). Not a required check, so it may be filtered by `paths`:
# only required checks need a gate job that always reports (see doc/ci.md).
on:
  push:
    branches: [ "main" ]
    paths: &site-inputs
      - 'site/**'
      - 'scripts/site/**'
      - '.github/workflows/site.yml'
      - 'flake.lock'
      # Copied into the site by scripts/site/prepare.sh.
      - 'screenshot_*.png'
      - 'rtmapp/assets/icons/rtmapp.svg'
      - 'rtmapp/assets/icons/rtmapp-small.svg'
  pull_request:
    branches: [ "main", "releases/**" ]
    paths: *site-inputs
  # External links break without any change here, so they are checked on a schedule, never on
  # pull requests: a remote outage must not block a merge.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

    # zola and lychee from the pinned nixpkgs, without the rest of the dev shell.
    - name: Build the site and check its links
      run: nix shell --inputs-from . nixpkgs#zola nixpkgs#lychee -c scripts/site/check.sh

    - name: Check external links
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      env:
        # Read by lychee, against GitHub's rate limits for github.com links.
        GITHUB_TOKEN: ${{ github.token }}
      run: nix shell --inputs-from . nixpkgs#zola nixpkgs#lychee -c scripts/site/check.sh --external
