name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    timeout-minutes: 30

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

    # rtmgui is a standalone workspace (see rtmgui/Cargo.toml), so the root commands above do not
    # cover it.
    - name: Build rtmgui
      run: cargo build --verbose --manifest-path rtmgui/Cargo.toml
    - name: Run rtmgui tests
      run: cargo test --verbose --manifest-path rtmgui/Cargo.toml
