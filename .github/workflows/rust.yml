name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    timeout-minutes: 30

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # GitHub-hosted Ubuntu runners resolve apt through a mirrorlist that tries
    # azure.archive.ubuntu.com before falling back to archive.ubuntu.com. When the Azure-local
    # mirror degrades (drops connections instead of refusing them), apt retries it per index
    # file across ~20 files, which can stall the job for hours. Pin the mirrorlist to the
    # canonical archive directly, and bound retries/timeouts explicitly as defence in depth
    # against a future runner image reintroducing a slow mirror by another route. Do not revert
    # this for the sake of a marginally faster "good day" run -- RTM-28.
    - name: Install system dependencies
      if: runner.os == 'Linux'
      timeout-minutes: 10
      run: |
        echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
        sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
        # Only true roots and packages NOT pulled in transitively by libgtk-3-dev or
        # libwebkit2gtk-4.1-dev on Ubuntu noble (verified against packages.ubuntu.com Depends:
        # fields, not assumed). libgtk-3-dev alone brings in libatk1.0-dev, libcairo2-dev,
        # libgdk-pixbuf-2.0-dev, libglib2.0-dev, libpango1.0-dev, libwayland-dev, libx11-dev
        # (which itself pulls libxcb1-dev), libxcursor-dev, libxi-dev, libxkbcommon-dev, and
        # libxrandr-dev. libwebkit2gtk-4.1-dev additionally brings in libsoup-3.0-dev.
        # libgirepository1.0-dev and libgl1-mesa-dev are not covered by either and stay
        # explicit; pkg-config stays explicit too since build scripts invoke the binary
        # directly and gtk3-dev's own dependency is on the related but distinct `pkgconf`.
        sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
          pkg-config \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libgirepository1.0-dev \
          libgl1-mesa-dev

    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
