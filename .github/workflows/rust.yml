name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    timeout-minutes: 30

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # GitHub-hosted Ubuntu runners resolve apt through a mirrorlist that tries
    # azure.archive.ubuntu.com before falling back to archive.ubuntu.com. When the Azure-local
    # mirror degrades (drops connections instead of refusing them), apt retries it per index
    # file across ~20 files, which can stall the job for hours. Pin the mirrorlist to the
    # canonical archive directly, and bound retries/timeouts explicitly as defence in depth
    # against a future runner image reintroducing a slow mirror by another route. Do not revert
    # this for the sake of a marginally faster "good day" run -- RTM-28.
    - name: Install system dependencies
      if: runner.os == 'Linux'
      timeout-minutes: 10
      run: |
        echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
        sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
        sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
          pkg-config \
          libglib2.0-dev \
          libgtk-3-dev \
          libatk1.0-dev \
          libgdk-pixbuf2.0-dev \
          libpango1.0-dev \
          libcairo2-dev \
          libwebkit2gtk-4.1-dev \
          libsoup-3.0-dev \
          libgirepository1.0-dev \
          libxcb1-dev \
          libx11-dev \
          libxcursor-dev \
          libxrandr-dev \
          libxi-dev \
          libgl1-mesa-dev \
          libxkbcommon-dev \
          libwayland-dev

    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
