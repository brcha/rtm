[package]
name = "rtmupdate"
version = "26.3.0"
edition = "2024"
publish = false

[dependencies]
# Blocking HTTP client; rustls instead of native-tls, so no OpenSSL is linked.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The release list is JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Release versions compare as semver, so a beta sorts below its release.
semver = "1"
thiserror = "2"
