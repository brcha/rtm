[package]
name = "rtmmcp"
version = "26.2.0"
edition = "2024"
publish = false

[dependencies]
todotxt = { path = "../todotxt" }
rtmsync = { path = "../rtmsync" }
# The official MCP SDK; pinned to a minor version, as its API changes between releases.
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1.54.1", features = ["rt"] }
thiserror = "2.0.21"

[target.'cfg(windows)'.dependencies]
# The parent process's ID, for the one-server-per-client check; the version rtmapp uses.
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
rmcp = { version = "3.9", default-features = false, features = ["client"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util"] }
uuid = { version = "1.5.0", features = ["v4"] }
