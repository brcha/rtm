[package]
name = "egui-theme-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone on purpose: keeps the spike out of the main workspace and Cargo.lock.
[workspace]

[dependencies]
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["datepicker"] }
image = { version = "0.25", default-features = false, features = ["png"] }
jiff = "0.2"
