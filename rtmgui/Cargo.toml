[package]
name = "rtmgui"
version = "0.1.3"
edition = "2024"
description = "egui desktop frontend for rtm (working name until it replaces rtmapp)"
license = "MIT"
repository = "https://github.com/brcha/rtm"

# Standalone workspace with its own Cargo.lock, not a member of the root one. rfd's `gtk3` and
# `xdg-portal` features cannot be built together (its build.rs panics), and the Tauri dialog plugin
# in the root workspace enables `gtk3`. Merge into the root workspace when the Tauri app is removed
# (RTM-39), and drop this table, the profile below and rtmgui/Cargo.lock then.
[workspace]

[dependencies]
todotxt = { path = "../todotxt" }
eframe = "0.37"
chrono = "0.4.31"
serde = { version = "1", features = ["derive"] }
# Same versions as rtmapp: both frontends read and write rtm/config.toml.
dirs = "5"
toml = "0.8"
rfd = "0.16"
env_logger = { version = "0.11.11", default-features = false }
# The calendar's first day of the week: the OS locale, and CLDR's week data for it.
sys-locale = "0.3"
icu_calendar = "2.4"
icu_locale_core = "2.4"

# Profiles only apply at a workspace root, so repeat the root workspace's release profile.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
