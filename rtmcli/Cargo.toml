[package]
name = "rtmcli"
version = "0.1.4"
edition = "2024"
description = "Rusty Todo.txt Manager — CLI"
license = "MIT"
repository = "https://github.com/brcha/rtm"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
todotxt = { path = "../todotxt" }
rtmsync = { path = "../rtmsync" }
chrono = "0.4.31"
clap = { version = "4.0", features = ["derive", "env"] }
uuid = "1.18.1"

# cargo-deb metadata -- RTM-8. name is pinned explicitly rather than left to derive from
# [package].name, matching the load-bearing-invariant precedent set for rtmapp's Windows
# packaging identity in root AGENTS.md.
[package.metadata.deb]
name = "rtmcli"
maintainer = "Filip Brcic <filip.brcic@brcha.com>"
section = "utils"
priority = "optional"
# Sync runs through the repository's own executable; without one rtmcli works unsynced.
suggests = "git, pijul"
assets = [
    ["target/release/rtmcli", "usr/bin/", "755"],
    ["../LICENSE", "usr/share/doc/rtmcli/copyright", "644"],
]
